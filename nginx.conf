# ============================================================
# EduAI 生产环境 Nginx 反代配置（参考）
# 本地开发：前端 :5173 / 后端 :8080 / OCR :8765
# 部署时把 localhost 换成真实地址，并按需加域名 + HTTPS
# ============================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # 与后端 multipart 对齐（max-file-size=20MB / max-request-size=25MB）。
    # 不设则 nginx 默认 1MB，上传图片/PDF 会被 413 拒绝。
    client_max_body_size 25m;

    # 反代统一入口（AGENTS.md §九：必须反代 /api/ /uploads/ /ocr 三条路径）
    server {
        listen 8090;

        # 前端（Vue dev server 或构建产物）
        location / {
            proxy_pass http://localhost:5173;
        }

        # 后端 REST API。SSE 流式必须关缓冲 + 长超时，否则 AI 流式会卡断。
        location /api/ {
            proxy_pass http://localhost:8080;
            proxy_http_version 1.1;
            proxy_buffering off;            # SSE 必须关闭缓冲
            proxy_cache off;
            proxy_read_timeout 600s;        # 流式 / 长任务超时
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection '';
            gzip off;
        }

        # 上传文件。后端 WebMvcConfig 已映射 /uploads/** → uploads 目录，
        # 这里不 strip 前缀，直接透传即可。
        location /uploads/ {
            proxy_pass http://localhost:8080;
        }

        # OCR（PaddleOCR Python 服务，独立进程）
        location /ocr {
            proxy_pass http://localhost:8765;
        }
    }
}
