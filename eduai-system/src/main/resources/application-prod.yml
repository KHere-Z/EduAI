# ==================== 生产环境配置 ====================
# 激活方式: --spring.profiles.active=prod

spring:
  datasource:
    hikari:
      # 支持 100~500 用户并发 AI：批改(gradeQuestion)在 AI 调用期间长占连接，需放大。
      # 上限受 MySQL max_connections 约束（默认 151），超过需同步调大 MySQL。
      maximum-pool-size: 200
      minimum-idle: 20

  jpa:
    show-sql: false                  # 关闭 SQL 输出
    hibernate:
      ddl-auto: validate             # 生产环境仅验证表结构，禁止自动修改
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

# Tomcat 线程池（生产调高）
server:
  tomcat:
    threads:
      max: 500                       # 最大工作线程
      min-spare: 20
    max-connections: 10000           # 最大连接数
    accept-count: 200                # 等待队列长度

# Redis 连接池（生产调高）
spring.data.redis.lettuce.pool:
  max-active: 20

# 日志级别（生产仅记录 info 及以上）
logging:
  level:
    com.eduai: info
    org.springframework: warn

# ==================== Actuator 监控（生产仅暴露健康检查） ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
